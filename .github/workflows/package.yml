name: Package

# Пакет pacman самої програми (obs-legacy-<версія>-1-x86_64.pkg.tar.zst) для релізу.
# Збирається в чистому контейнері Arch з архіву тегу: у .BUILDINFO пакета лише
# пакети цього контейнера, а не список програм чийогось комп'ютера.
#   * реліз опубліковано — збирає й прикріплює до нього;
#   * вручну (Actions → Package → Run workflow, тег) — те саме для наявного релізу;
#   * PR, що змінює packaging/ чи цей файл, — лише збирає з вихідних кодів PR, з тестами
#     (перевірка PKGBUILD).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релізу, напр. v0.0.2'
        required: true
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/package.yml'

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Prepare Arch
        run: |
          pacman -Syu --noconfirm --needed git rust github-cli pacman-contrib
          useradd -m builder

      - uses: actions/checkout@v4

      - name: Build
        run: |
          cp -r packaging /home/builder/pkg
          cd /home/builder/pkg
          if [ -n "$TAG" ]; then
            # Реліз: архів тегу з GitHub, версія з тегу й свіжі контрольні суми. Тести цього
            # коміту вже пройшли в CI (ci.yml), тож check() тут не повторюємо.
            sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
            chown -R builder: .
            sudo -u builder updpkgsums
            opts=--nocheck
          else
            # PR: ті самі кроки з вихідних кодів цього PR, разом із тестами в чистому Arch.
            ver=$(sed -n 's/^pkgver=//p' PKGBUILD)
            git -C "$GITHUB_WORKSPACE" archive --format=tar.gz --prefix="OBS-Legacy-$ver/" \
              -o "$PWD/obs-legacy-$ver.tar.gz" HEAD
            chown -R builder: .
            opts=--skipchecksums
          fi
          sudo -u builder env PACKAGER='YellowHearth1 <111094130+YellowHearth1@users.noreply.github.com>' \
            makepkg --noconfirm --noprogressbar "$opts"
          for f in *.pkg.tar.zst; do sha256sum "$f" > "$f.sha256"; done
          ls -l *.pkg.tar.zst*

      - name: Upload to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" /home/builder/pkg/*.pkg.tar.zst /home/builder/pkg/*.pkg.tar.zst.sha256 --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep the package (PR)
        if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: obs-legacy-package
          path: /home/builder/pkg/*.pkg.tar.zst*
